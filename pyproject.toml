[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xtg-mid-gui"
version = "0.1.0"
description = "XTG analysis GUI for European XFEL MID (p11456 Jungfraus + diodes, p7016 AGIPD + HIREX/DES, scan-by-scan delay series)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "h5py", "pyqtgraph>=0.13", "pyyaml"]

[project.optional-dependencies]
qt = ["PyQt5"]
yaml = ["pyyaml"]

[project.scripts]
xtg-mid-gui = "xtg_mid_gui.gui:main"

[tool.setuptools]
packages = ["xtg_mid_gui"]

[tool.setuptools.package-data]
xtg_mid_gui = ["presets/*.yaml"]
